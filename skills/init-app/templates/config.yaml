# SDLC skills configuration. Contract version 1.
# Schema: .sdlc/sdlc.config.schema.json  (copied here by init-app)
# Every key is optional; defaults are documented in docs/extension-points.md of the skills repo.
version: 1

repo:
  kind: app             # app: builds and ships code; workspace: a foundation repo with no build that holds cross-repo PRDs, plans and rules
  name: null            # how plans refer to this repo; null = the folder name

workspace:              # read only when repo.kind is workspace
  repos: []
#  - name: billing-api
#    path: applications/billing-api   # local checkout relative to this repo, if nested here
#    url: https://github.com/example/billing-api

repo:
  kind: app             # app: builds and ships code; workspace: a foundation repo with no build that holds cross-repo PRDs, plans and rules
  name: null            # how plans refer to this repo; null = the folder name

workspace:              # read only when repo.kind is workspace
  repos: []
#  - name: billing-api
#    path: applications/billing-api   # local checkout relative to this repo, if nested here
#    url: https://github.com/example/billing-api

artefacts:
  prd_dir: prds
  prd_layout: folder    # folder: prds/<id>/prd.md, revisions and mockups inside; flat: prds/<id>.md
  plan_dir: plans
  investigations_dir: investigations
  mockup_dir: null      # null = mockups/ inside the PRD folder

ids:
  prd: "{slug}"         # the feature name is its identity; {tracker}, {seq:N}, {date}, {initials} also available
  revision: "{prd}-R{seq:2}"

tracker:
  type: none            # github | ado | none
  issue_ref: "#{n}"

branches:
  prd: "docs/{id}"
  work: "feat/{id}"
  fix: "fix/{id}"

# The role vocabulary the PRD skill maps personas onto. Personas are not authorisation.
roles: []
#  - name: admin
#    description: Full access, including destructive actions.
#  - name: viewer
#    description: Read-only.

design_system:
  path: null            # folder of tokens/components a mockup must use
  guide: null           # file the mockup builder reads first

placeholder_data: null  # one paragraph of realistic sample-data context for mockups

validation:             # null = discover from package.json / Makefile at run time
  lint: null
  typecheck: null
  test: null
  e2e: null
  build: null

context:
  always_read: []       # files the plan skill reads before exploring, every time
  knowledge_index: false

learning:
  gotchas_dir: null     # e.g. docs/gotchas
  decisions_dir: null   # e.g. docs/decisions
